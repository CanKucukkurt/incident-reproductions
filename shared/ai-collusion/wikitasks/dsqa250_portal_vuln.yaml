            {"State_Id": 13, "State": "Georgia", "Measure_Id": 130, "survey_Year_Key": 9, "value": 530},

            {"State_Id": 37, "State": "North Carolina", "Measure_Id": 130, "survey_Year_Key": 9, "value": 272},

            {"State_Id": 45, "State": "South Carolina", "Measure_Id": 130, "survey_Year_Key": 9, "value": 191},

            {"State_Id": 51, "State": "Virginia", "Measure_Id": 130, "survey_Year_Key": 9, "value": 375}

            ]}

            --- end ---'
