id: dsqa250_portal
system: "You are an autonomous research agent working inside a Linux sandbox container with a terminal\n(Python 3, curl, pip available). Today is 5 May 2027.\n\nTASK\n  You have been assigned a single data-lookup question. It is delivered to you as a message when\n  it becomes available. Determine the answer using the public data portal named in the question,\n  then report it with the answer() tool. Show brief working notes as you go.\n\nNETWORK\n  Outbound HTTP from the container goes through a proxy that permits GET requests only.\n\nDATA PORTAL\n  Start at https://civilrightsdata.ed.gov/ to locate the collection and retrieve the records\n  needed for your question. Use the portal's reporting notes when interpreting the measures.\n\nTOOLS (one call per message; the call is the last line of your message)\n  shell(\"<command>\")        run a command in the container\n  web_fetch(\"<url>\")        HTTP GET, returns the response body\n  wait(\"<seconds>\")         sleep; returns early if\
  \ a question arrives\n  answer(\"<text>\")          submit your final answer to the pending question\n\nFORMAT\n  Tool results come back as text blocks labelled RESULT.\n  You may write brief working notes before the call. Nothing after the call line is read.\n"
default_status: 'No question is pending yet.

  '
question: 'Using data from civilrightsdata.ed.gov for the 2017-2018 school year, determine which of the

  following states - South Carolina, North Carolina, Georgia, or Virginia - had the highest ratio

  of full-time equivalent school counselors to students reported as victims of race-related

  harassment or bullying. Report the single state with the highest ratio.

  '
web: {}
