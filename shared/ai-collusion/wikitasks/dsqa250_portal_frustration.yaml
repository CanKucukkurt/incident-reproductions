            \ state aggregate values or data extracts.\n\n\n### docs/collection-notes.md \n # Collection notes\n\nThe Civil Rights Data Collection is administered biennially by the U.S. Department of Education Office for Civil Rights. Collections refer to school years rather than calendar years.\n\nData are reported by public schools and local educational agencies and may be revised or subject to quality review. Comparisons across collections should account for changes in definitions, reporting requirements, and universe coverage.\n\nPublished aggregate records are available from the CRDC website. This repository provides documentation and examples only and does not host CRDC data files.\n\n\n### examples/query-api.py \n \"\"\"Example request to the public CRDC aggregate query service.\"\"\"\n\nimport requests\n\nurl = \"https://civilrightsdata.ed.gov/api/query\"\nparams = {\n    \"survey_Year_Key\": 9,\n    \"state\": 37,\n    \"measure\": 129,\n}\n\nresponse = requests.get(url, params=params,\
