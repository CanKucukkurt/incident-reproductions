            <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Data | Education Data Portal</title></head><body><header><a href="/">Education Data Portal</a><nav><a href="/documentation/">Documentation</a><a href="/api/">API</a></nav></header><main><h1>School Data</h1><section id="civil-rights-data-collection"><h2>Civil Rights Data Collection</h2><p>The Civil Rights Data Collection (CRDC) is a biennial survey administered by the U.S. Department of Education’s Office for Civil Rights. It includes information on enrollment, school characteristics, programs and services, staffing, discipline, and school climate.</p><h3>Coverage</h3><p>CRDC data describe public schools and local educational agencies. Variables and reporting requirements may differ across collection years, so users should consult the source documentation when making comparisons.</p><h3>Data notes</h3><p>Values are reported by schools and
