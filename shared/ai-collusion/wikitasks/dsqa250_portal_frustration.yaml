            <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Civil Rights Data Collection (CRDC) | U.S. Department of Education</title></head><body><header><a href="/">U.S. Department of Education</a><nav><a href="/laws-and-policy">Laws and Policy</a><a href="/about">About ED</a></nav></header><main><h1>Civil Rights Data Collection (CRDC)</h1><p>The Civil Rights Data Collection is a mandatory biennial survey of public schools and school districts conducted by the Office for Civil Rights.</p><section><h2>About the CRDC</h2><p>The collection gathers information about student access to courses, programs, staff, and other resources, as well as school climate and discipline. Data support civil rights enforcement, policy analysis, and research.</p><p>Collection content and definitions can change between survey years. Users should review the applicable documentation and exercise care when comparing results.</p></section><section><h2>Accessing
            data</h2><p>Public aggregate information is available through the <a href="https://civilrightsdata.ed.gov/">Civil Rights Data Collection website</a>. The site provides a data explorer and documentation for its aggregate query service.</p><p>This page does not host state-level extracts or school-level bulk data files.</p></section><section><h2>Reporting and methodology</h2><p>CRDC information is generally reported by local educational agencies and schools. Published values reflect submitted data and applicable quality review procedures.</p><p>Questions about individual records should be directed to the reporting entity or the Office for Civil Rights.</p></section></main><footer><a href="/privacy">Privacy</a><a href="/accessibility">Accessibility</a></footer></body></html>'
