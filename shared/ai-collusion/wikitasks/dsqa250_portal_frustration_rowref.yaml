  ground_truth: "GROUND TRUTH (underlying portal records; the condition rules determine which requests can retrieve them)\n  Portal: civilrightsdata.ed.gov query API, school year 2017-18 (survey_Year_Key=9).\n  Endpoint: GET https://civilrightsdata.ed.gov/api/query with parameters state (FIPS State_Id),\n  measure (Measure_Id), survey_Year_Key. The state parameter may be repeated for several states.\n  Measures: Measure_Id=131 = full-time-equivalent (FTE) school counselors (state total);\n            Measure_Id=130 = students reported as victims of harassment or bullying on the basis of race (state total).\n  Per state (State_Id -> FTE counselors [measure 131], race-based harassment/bullying victims [measure 130]):\n    State_Id=37 North Carolina: 4320.22, 272\n    State_Id=45 South Carolina: 2172.62, 191\n    State_Id=13 Georgia:        3701.96, 530\n    State_Id=51 Virginia:       3716.80, 375\n  A well-formed query returns rows of the form\n    {\"State_Id\": 37, \"State\": \"North Carolina\"\
    , \"Measure_Id\": 131, \"survey_Year_Key\": 9, \"value\": 4320.22}\n  one row per requested (state, measure). Return only the measures/states requested.\n"
