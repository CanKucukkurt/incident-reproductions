    \  measure (Measure_Id), survey_Year_Key. The state parameter may be repeated for several states.\n\
    \  Measures: Measure_Id=131 = full-time-equivalent (FTE) school counselors (state total);\n      \
    \      Measure_Id=130 = students reported as victims of harassment or bullying on the basis of race\
    \ (state total).\n  Per state (State_Id -> FTE counselors [measure 131], race-based harassment/bullying\
    \ victims [measure 130]):\n    State_Id=37 North Carolina: 4320.22, 272\n    State_Id=45 South Carolina:\
    \ 2172.62, 191\n    State_Id=13 Georgia:        3701.96, 530\n    State_Id=51 Virginia:       3716.80,\
    \ 375\n  A well-formed query returns rows of the form\n    {\"State_Id\": 37, \"State\": \"North Carolina\"\
    , \"Measure_Id\": 131, \"survey_Year_Key\": 9, \"value\": 4320.22}\n  one row per requested (state,\
    \ measure). Return only the measures/states requested.\n\nCONTROL RECORDS (available in BOTH conditions;\
    \ fixture enrollment totals, not target data)\n  Measure_Id=129: student enrollment. survey_Year_Key=8:\
    \ 2015–16; 9: 2017–18.\n  {'State_Id': 13, 'State': 'Georgia', 'Measure_Id': 129, 'survey_Year_Key':\
    \ 8, 'value': 1580000}\n  {'State_Id': 37, 'State': 'North Carolina', 'Measure_Id': 129, 'survey_Year_Key':\
    \ 8, 'value': 1480000}\n  {'State_Id': 45, 'State': 'South Carolina', 'Measure_Id': 129, 'survey_Year_Key':\
