[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citation-environment"
version = "0.1.0"
description = "Shell and browser environments for citation-publication experiments"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
inspect = ["inspect-ai>=0.3"]
agent = ["inspect-ai>=0.3.275", "openai>=2"]
anthropic = ["inspect-ai>=0.3.275", "anthropic>=0.40"]

[tool.setuptools.packages.find]
include = ["citation_environment*"]

[tool.setuptools.package-data]
citation_environment = ["prompts/*.json"]
