[project]
name = "compaction-reader"
version = "0.1.0"
description = "Reader-side harness: do post-compaction agents follow concealment instructions planted in a summary?"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.40",
  "pydantic>=2.5",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
cr = "compaction_reader.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["compaction_reader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
