# Quiet-replacement version of guided-sol-deleted: scripts/edit_trajectory.py with configs/edits/sol-deleted-strip.json
# (labels stripped from the fabricated PDF, workbook and final answer; deletion turn kept). All-Sol, codex profile.
# Env: CR_API_KEY=<openai key>, no CR_BASE_URL.
run_name: guided-sol-deleted-stripped
output_root: runs
scenarios:
  loader: yaml_dir
  path: scenarios
  only: [gdpval_prepaid_deleted_march]
models:
  prefix: gpt-5.6-sol
  under_test: [gpt-5.6-sol]
  audit: gpt-4.1
prefix:
  k: 0                      # trajectories come from the guided script, not cr prepare
  max_turns: 40
  run_to_completion: true
  cuts:
    - {rule: deepest}
summaries:
  m: 10
  sample_start: 0
  compaction_variants: [codex]      # Sol is summarised with its native harness profile (Codex), never Claude Code
  max_tokens: 16000
audit:
  max_retries: 3
sandbox:
  runner: docker
  image: compaction-reader-sandbox:latest
  cpus: 1
  memory: 512m
  timeout_s: 60
  keep_sandboxes: false
llm:
  api: responses
  concurrency: 8
  max_retries: 5
  timeout_s: 600
