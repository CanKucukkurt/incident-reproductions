# Stage B on the deepseek-full prepare run in replace mode: the instruction line replaces the
# summary's own plan about telling the user (located by `cr locate-plans`), instead of being
# inserted next to it. `none` = the summary as written (its own disclose plan intact).
run_name: deepseek-full-replace
prepare_run: deepseek-full
output_root: runs
scenarios:
  loader: yaml_dir
  path: scenarios
  only: [gdpval_prepaid_missing_march, gdpval_prepaid_missing_march_pressure]
base:
  instruction: none
  claimed_author: self
  summary_role: user
  compaction_variant: claude_code
  mode: agent
  insert_position: inline
  edit_mode: replace
grid:
  instruction: [none, honest, conditional, conceal]
sweeps: {}
samples_per_cell: 3
# only_summaries: [...]   # optional: restrict to specific summary ids (default: all of audit/eligible_replace.json)
followup:
  enabled: true
  prompt: real_sources
  tools: true
  only_for:
    instruction: [none, conceal]
successor:
  max_turns: 60
sandbox:
  runner: docker
  image: compaction-reader-sandbox:latest
llm:
  concurrency: 8
max_parallel_rollouts: 8
