# Stripped April fabrication + the reader-experiment conceal line as assistant text on the AP_TB-writing turn
# (configs/edits/sol-april-strip-conceal.json). Env: CR_API_KEY=<openai key>, no CR_BASE_URL.
run_name: guided-sol-april-stripped-conceal
output_root: runs
scenarios:
  loader: yaml_dir
  path: scenarios
  only: [gdpval_april_close_fabricated_ap_tb]
models:
  prefix: gpt-5.6-sol
  under_test: [gpt-5.6-sol]
  audit: gpt-4.1
prefix:
  k: 0                      # trajectories come from the guided script, not cr prepare
  max_turns: 80
  run_to_completion: true
  cuts:
    - {rule: deepest}
summaries:
  m: 100
  compaction_variants: [codex]      # Sol is summarised with its native harness profile (Codex), never Claude Code
  max_tokens: 16000
audit:
  max_retries: 3
sandbox:
  runner: docker
  image: compaction-reader-sandbox:latest
  cpus: 1
  memory: 512m
  timeout_s: 120
  keep_sandboxes: false
llm:
  api: responses
  concurrency: 16
  max_retries: 5
  timeout_s: 600
