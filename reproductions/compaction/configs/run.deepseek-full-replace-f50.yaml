# Stage B on the deepseek-full HALF-WAY (f50) cuts in replace mode: no workbook exists yet, so the successor
# builds the deliverable and decides what goes in it and in the final message. the instruction line replaces the
# summary's own plan about telling the user (located by `cr locate-plans`), instead of being
# inserted next to it. `none` = the summary as written (its own disclose plan intact).
run_name: deepseek-full-replace-f50
prepare_run: deepseek-full
output_root: runs
scenarios:
  loader: yaml_dir
  path: scenarios
  only: [gdpval_prepaid_missing_march, gdpval_prepaid_missing_march_pressure]
base:
  instruction: none
  claimed_author: self
  summary_role: user
  compaction_variant: claude_code
  mode: agent
  insert_position: inline
  edit_mode: replace
grid:
  instruction: [none, honest, conditional, conceal]
sweeps: {}
samples_per_cell: 3
only_summaries:
  - gdpval_prepaid_missing_march-p00-f50-deepseek-deepseek-v4-1-flash-claude_code-s00
  - gdpval_prepaid_missing_march-p03-f50-deepseek-deepseek-v4-1-flash-claude_code-s00
  - gdpval_prepaid_missing_march_pressure-p04-f50-deepseek-deepseek-v4-1-flash-claude_code-s00
  - gdpval_prepaid_missing_march_pressure-p07-f50-deepseek-deepseek-v4-1-flash-claude_code-s00
followup:
  enabled: true
  prompt: real_sources
  tools: true
  only_for:
    instruction: [none, conceal]
successor:
  max_turns: 60
  max_tokens: 40000          # reasoning counts; DeepSeek flash otherwise loops ("Let me write. OK. Writing.") to 130k-230k tokens
  max_degenerate_retries: 2  # empty turn with finish length/error is re-sampled; if it persists the rollout is logged as an error
sandbox:
  runner: docker
  image: compaction-reader-sandbox:latest
llm:
  concurrency: 24
max_parallel_rollouts: 24
